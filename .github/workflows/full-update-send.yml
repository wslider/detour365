name: Full Update + Send

on:
  workflow_dispatch:

jobs:
  full-update-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Update stats and generate blog
        env:
          D365_YOUTUBE_API_KEY: ${{ secrets.D365_YOUTUBE_API_KEY }}
        run: python python/full_update_send.py

      - name: Commit generated files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add plots/ \
                  data/d365_yt_stats.json \
                  data/d365_yt_embeds.json \
                  data/blog.json \
                  blog.html \
                  posts/
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "chore: update stats, plots, and blog" && git push)

      - name: Send newsletter
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python python/auto_email_list.py
        continue-on-error: true