name: Sync YouTube archive

on:
  schedule:
    - cron: "0 6 * * 4"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Sync videos
        run: node scripts/sync-youtube.mjs
        env:
          D365_YOUTUBE_API_KEY: ${{ secrets.D365_YOUTUBE_API_KEY }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Update channel stats and plots
        run: python python/stats.py
        env:
          D365_YOUTUBE_API_KEY: ${{ secrets.D365_YOUTUBE_API_KEY }}

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update YouTube archive and stats"
          file_pattern: |
            data/youtube.json
            data/d365_yt_stats.json
            plots/*.png