name: Update Bible Study Stats

on:
  # Run every Saturday at 12:00 UTC
  schedule:
    - cron: '0 12 * * 6'

  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate charts
        run: python python/stats.py

      - name: Commit and push updated plots
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add plots/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Bible study charts" && git push)