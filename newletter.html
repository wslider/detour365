<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detour 365 Newsletter</title>
    <style>
        :root {
            --sprucePine: #003a00; 
            --kentuckyNight: #000d08;
            --mountainFog: #f0fff8; 
            --stormCloud: #333849;
            --campfireSmoke: #2f2e2eb3;
            --smokeyMountainMist: #b0c4de;
            --blueRidgeParkway: #002167;
            --starLight: #e1ceff; 
            --midnightBlue: #001f3f;
            --transparentMidnight: #001f3f80;
            --marianaTrench: #00111f;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 2rem;
        }

        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            color: var(--mountainFog); 
            display: flex; 
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            margin: 0; 
            min-height: 100vh;
            background-image: url('https://detour365.org/images/tartoosh-sunset-trail.jpeg');
            background-size: cover;           
            background-position: center;      
            background-repeat: no-repeat;     
            background-attachment: fixed;     
            background-color: var(--kentuckyNight);
        }   

        .header {
            font-size: 2rem;
            text-align: center;
            width: 100%;
            text-shadow: 3px 3px 5px #000000a1;
            color: var(--mountainFog); 
            background-color: var(--transparentMidnight);
        }

        h1, h2, h3 { color: var(--mountainFog); }
        h2 { font-size: 1.8rem; }
        h3 { font-size: 1.4rem; }

        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .container {
            width: clamp(300px, 95%, 800px);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px auto;
            padding: 15px;
            background-color: var(--transparentMidnight);
            box-shadow: 5px 5px 15px #000000a1;
            border-radius: 8px;
        }

        .container.iframe-container {
            min-height: fit-content; 
            padding: 5vh 5vw; 
        }

        .iframe {
            width: 100%; 
            height: 315px; 
            box-sizing: border-box;
        }

        @media only screen and (min-width: 600px) {
            .iframe {
                height: 315px; 
                width: 560px; 
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>Detour 365 - Newsletter</h1>
        <h2>{context['date']}</h2>
    </header>
    <main class="main">
        <div class="container iframe-container" id="player-container">
            <h2>Latest Episode on YouTube</h2>
            <iframe class="iframe" id="player"
                src="{context['youtube_src']}" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>
    </main>
</body>
</html>
